name: Build and deploy ASP.NET MVC 5 app to Azure Web App - pact-luxewardrobe

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Restore NuGet packages
        run: nuget restore LuxeWardrobe.sln

      - name: Build solution
        run: msbuild LuxeWardrobe.sln /nologo /verbosity:minimal /p:Configuration=Release

      - name: Prepare deployment files
        shell: pwsh
        run: |
          $publishDir = "${{ github.workspace }}\published"
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          robocopy "${{ github.workspace }}\LuxeWardrobe" $publishDir /E /XD obj Properties /XF *.cs *.csproj packages.config README.md

          if ($LASTEXITCODE -ge 8) {
            exit $LASTEXITCODE
          }

          exit 0

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: published
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: published

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_48BA4F0ECE084D308759C6BE692A9DCF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_89381A7E53D44C8B88F50BF09A7FB3DB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_828C715B97114A848FFBB59982794D3B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: pact-luxewardrobe
          slot-name: Production
          package: published
